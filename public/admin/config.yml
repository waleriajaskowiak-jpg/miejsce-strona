  - name: kategorie
    label: Rodzaje wydarzeń
    label_singular: Rodzaj
    folder: src/content/kategorie
    create: true
    delete: false
    extension: md
    format: frontmatter
    summary: "{{title}}"
    preview_path: "eventy/{{slug}}/"
    fields:
      - { label: Tytuł, name: title, widget: string }
      - { label: Etykieta w menu, name: nav_label, widget: string }
      - { label: Kolor wydarzenia, name: kolor, widget: color, hint: "Tło akcentu. Wesela #D9C8B4, firma #B15E3E, konferencje #6B7A5E, premiery #375C6B" }
      - { label: Tekst na kolorze, name: kolor_tekst, widget: color, hint: "Musi mieć kontrast AA z kolorem wydarzenia" }
      - { label: Kolejność, name: kolejnosc, widget: number, value_type: int }
      - { label: "Szkic (noindex)", name: szkic, widget: boolean, default: false }
      - { label: Tytuł SEO, name: seo_title, widget: string }
      - { label: Opis SEO, name: seo_description, widget: text }
      - { label: Lead, name: lead, widget: text }
      - { label: Tekst przycisku, name: cta, widget: string }
      - label: Formaty
        name: formaty
        widget: list
        summary: "{{fields.tytul}}"
        hint: "Każdy punkt to zakładka w sekcji „Co można tu ułożyć”: wstęp i trzy karty tekstowe, bez zdjęcia"
        fields:
          - { label: Tytuł zakładki, name: tytul, widget: string }
          - { label: Wstęp, name: opis, widget: text }
          - { label: Rodzaj w formularzu, name: rodzaj, widget: string, hint: "id z cennika: wesele, integracja, firmowy, garden-party, konferencja, szkolenie, premiera", required: false }
          - label: Karty
            name: karty
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Tytuł, name: tytul, widget: string }
              - { label: Tekst, name: opis, widget: text }
      - { label: "Do uzupełnienia (nie publikować w produkcji)", name: do_uzupelnienia, widget: text, required: false }
      - { label: Wstęp, name: body, widget: markdown }

  - name: przestrzenie
    label: Przestrzenie
    label_singular: Przestrzeń
    folder: src/content/przestrzenie
    create: true
    delete: false
    slug: "{{fields.adres_url}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    preview_path: "przestrzenie/{{slug}}/"
    fields:
      - { label: Nazwa, name: title, widget: string }
      - { label: Adres URL, name: adres_url, widget: string, hint: "np. duze-miejsce" }
      - { label: Kolejność, name: kolejnosc, widget: number, value_type: int }
      - { label: Lead, name: lead, widget: text }
      - { label: Linia ze specyfikacją, name: meta, widget: string }
      - { label: Opis SEO, name: opis_seo, widget: text }
      - { label: "Cena od (zł, puste jeśli brak)", name: cena_od, widget: number, value_type: int, required: false }
      - { label: Etykieta ceny, name: cena_etykieta, widget: string, required: false }
      - label: Najlepiej sprawdza się na
        name: najlepiej
        widget: list
        field: { label: Okazja, name: okazja, widget: string }
      - label: W skrócie
        name: w_skrocie
        widget: list
        field: { label: Punkt, name: punkt, widget: string }
      - { label: Zdjęcie główne, name: cover, widget: image }
      - label: Zdjęcia
        name: zdjecia
        widget: list
        field: { label: Zdjęcie, name: zdjecie, widget: image }
      - { label: Opis, name: body, widget: markdown }

  - name: scenariusze
    label: Scenariusze eventów
    label_singular: Scenariusz
    folder: src/content/scenariusze
    create: true
    delete: false
    slug: "{{fields.adres_url}}"
    extension: md
