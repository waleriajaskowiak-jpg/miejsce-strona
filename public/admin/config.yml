      - { label: Opis SEO, name: seo_description, widget: text }
      - { label: Lead, name: lead, widget: text }
      - { label: Tekst przycisku, name: cta, widget: string }
      - label: Formaty
        name: formaty
        widget: list
        summary: "{{fields.tytul}}"
        hint: "Każdy punkt to zakładka w sekcji „Co można tu ułożyć”: wstęp i trzy karty tekstowe, bez zdjęcia"
        fields:
          - { label: Tytuł zakładki, name: tytul, widget: string }
          - { label: Wstęp, name: opis, widget: text }
          - { label: Rodzaj w formularzu, name: rodzaj, widget: string, hint: "id z cennika: wesele, integracja, firmowy, garden-party, konferencja, szkolenie, premiera", required: false }
          - label: Karty
            name: karty
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Tytuł, name: tytul, widget: string }
              - { label: Tekst, name: opis, widget: text }
      - { label: "Do uzupełnienia (nie publikować w produkcji)", name: do_uzupelnienia, widget: text, required: false }
      - { label: Wstęp, name: body, widget: markdown }

