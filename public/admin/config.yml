      - { label: Kolor wydarzenia, name: kolor, widget: color, hint: "Tło akcentu. Wesela #D9C8B4, firma #B15E3E, konferencje #6B7A5E, premiery #375C6B" }
      - { label: Tekst na kolorze, name: kolor_tekst, widget: color, hint: "Musi mieć kontrast AA z kolorem wydarzenia" }
